    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        
        body {
            font-family: 'Cairo', sans-serif;
            margin: 0;
            background-color: #FDFCF8;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- Motion Graphics Icon Animations --- */
        .motion-icon-wrapper {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            vertical-align: middle;
        }

        .group:hover .motion-icon-wrapper {
            transform: scale(1.18) rotate(8deg);
            filter: drop-shadow(0 0 8px rgba(139, 92, 246, 0.35));
        }

        @keyframes icon-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        .animate-icon-float { animation: icon-float 3s ease-in-out infinite; }

        @keyframes icon-pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.08); opacity: 0.85; }
            100% { transform: scale(1); opacity: 1; }
        }
        .active-pulse { animation: icon-pulse 2s infinite ease-in-out; }

        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .animate-shake { animation: shake 0.4s ease-in-out; }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-thumb { background: #2E1A47; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #D1C4E9; border-radius: 10px; }

        .animate-in { animation-duration: 0.5s; animation-fill-mode: both; }
        .fade-in { animation-name: fadeIn; }
        .zoom-in-95 { animation-name: zoomIn95; }
        .slide-in-bottom { animation-name: slideInBottom; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes zoomIn95 { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideInBottom { from { transform: translateY(18px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .glass-morphism {
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .gold-glow {
            box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.35);
        }
    </style>

        const MotionIcon = ({ iconName, size = 20, className = "" }) => {
            const path = ICON_PATHS[iconName];
            if (!path) {
                return (
                    <span className={`inline-block border border-purple-300 rounded bg-purple-100 ${className}`} 
                          style={{width: size, height: size, minWidth: size, minHeight: size, opacity: 0.5}}>
                    </span>
                );
            }

            return (
                <span className="motion-icon-wrapper">
                    <svg 
                        width={size} 
                        height={size} 
                        viewBox="0 0 24 24" 
                        fill="none" 
                        stroke="currentColor" 
                        strokeWidth="2.3" 
                        strokeLinecap="round" 
                        strokeLinejoin="round" 
                        className={`transition-all duration-300 ${className}`}
                        style={{ display: 'block' }}
                    >
                        <path d={path} />
                    </svg>
                </span>
            );
        };

            goldGradient: "bg-gradient-to-r from-amber-400 to-yellow-600"
        };

        const fetchRealIP = async () => {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return String(data.ip);
            } catch (e) { return "127.0.0.1 (محلي)"; }
        };

        const getDeviceInfo = () => {
            const ua = navigator.userAgent;
            if (/android/i.test(ua)) return "جهاز أندرويد";
            if (/iPad|iPhone|iPod/.test(ua)) return "آيفون / iOS";
            if (/Windows/i.test(ua)) return "كمبيوتر ويندوز";
            if (/Mac/i.test(ua)) return "ماكنتوش";
            return "متصفح الويب";
        };

            <button type="button" onClick={onClick} className={`group flex items-center justify-between w-full p-3.5 rounded-2xl transition-all duration-300 ${active ? 'bg-white/10 text-white shadow-inner font-black' : 'text-purple-200 hover:bg-white/5 font-bold'}`}>
                <div className="flex items-center gap-3.5">
                    <div className={`p-2.5 rounded-xl transition-all duration-300 relative ${active ? 'bg-purple-500 text-white shadow-lg active-pulse' : 'bg-white/5 text-purple-200'}`}>
                        <MotionIcon iconName={iconName} size={20} />
                        {!active && badge && <span className="absolute -top-1 -right-1 bg-red-500 w-2.5 h-2.5 rounded-full border-2 border-[#2E1A47] animate-pulse"></span>}
                    </div>
                    <span className="text-sm">{label}</span>
                </div>
                {badge && <span className="bg-red-500 text-white text-[10px] font-black px-2 py-0.5 rounded-lg shadow-lg animate-bounce">{badge}</span>}
            </button>
        );

        const MobileNavItem = ({ iconName, active, onClick, badge, label }) => (
            <button type="button" onClick={onClick} className={`p-2 rounded-2xl transition-all duration-300 group relative flex flex-col items-center gap-1 ${active ? 'text-[#2E1A47] font-black scale-105' : 'text-gray-400 font-bold'}`}>
                <div className={`p-1.5 rounded-xl transition-colors ${active ? 'bg-purple-100 text-[#2E1A47]' : ''}`}>
                    <MotionIcon iconName={iconName} size={22} className={active ? "active-pulse" : ""} />
                </div>
                <span className="text-[10px]">{label}</span>
                {badge && <span className="absolute top-1 right-2 bg-red-500 text-white text-[9px] font-black px-1.5 py-0.2 rounded-full ring-2 ring-white animate-bounce">{badge}</span>}
            </button>
        );

        const AuthForm = ({ view, setView, onLogin, onRegister }) => {
            const [name, setName] = useState('');
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true); setError('');
                const err = view === 'login' ? await onLogin(username, password) : await onRegister(name, username, password);
                if (err) setError(err);
                setLoading(false);
            };

            return (
                <form onSubmit={handleSubmit} className="space-y-4 animate-in fade-in">
                    {view === 'register' && (
                        <div className="relative group">
                            <div className="absolute right-4 top-1/2 -translate-y-1/2">
                                <MotionIcon iconName="User" className="text-gray-400 group-focus-within:text-purple-500" size={18} />
                            </div>
                            <input type="text" placeholder="الاسم الكامل" value={name} onChange={e => setName(e.target.value)} className="w-full pr-12 pl-4 p-4 bg-gray-50 rounded-2xl outline-none focus:ring-2 focus:ring-purple-500 border border-gray-100 font-bold text-sm" />
                        </div>
                    )}

                            <MotionIcon iconName="Fingerprint" className="text-gray-400 group-focus-within:text-purple-500" size={18} />
                        </div>
                        <input type="text" placeholder="اسم المستخدم (Username)" value={username} onChange={e => setUsername(e.target.value)} className="w-full pr-12 pl-4 p-4 bg-gray-50 rounded-2xl outline-none focus:ring-2 focus:ring-purple-500 border border-gray-100 font-bold text-sm" />
                    </div>

                        <div className="absolute right-4 top-1/2 -translate-y-1/2">
                            <MotionIcon iconName="Lock" className="text-gray-400 group-focus-within:text-purple-500" size={18} />
                        </div>

                    {error && <p className="text-red-500 text-xs px-2 font-black animate-shake">{String(error)}</p>}

                        {loading ? <MotionIcon iconName="RefreshCcw" className="animate-spin" size={20} /> : (
                            <>
                                <MotionIcon iconName={view === 'login' ? 'ShieldCheck' : 'UserPlus'} size={20} className="group-hover:rotate-12" />
                                <span>{view === 'login' ? 'تسجيل الدخول' : 'إنشاء حساب جديد'}</span>
                            </>
                        )}
                    </button>
                    <button type="button" onClick={() => setView(view === 'login' ? 'register' : 'login')} className="w-full text-center text-purple-600 font-black text-xs mt-4 underline underline-offset-4">
                        {view === 'login' ? 'ليس لديك حساب؟ إنشاء حساب جديد' : 'لديك حساب بالفعل؟ تسجيل الدخول'}

                        <div className="flex justify-between items-center mt-3">
                            <span className="text-[11px] text-gray-400 font-bold">مشاركة عامة</span>
                            <button type="button" disabled={!text.trim()} onClick={() => { createPost(text); setText(''); }} className="group px-7 py-3 bg-[#2E1A47] text-white rounded-xl font-black shadow-lg transform active:scale-95 transition-all flex items-center gap-2 text-sm disabled:opacity-40">
                                <MotionIcon iconName="Send" size={17} className="rotate-180 group-hover:-translate-x-1" />
                                <span>نشر</span>
                            </button>
                        </div>
                    </div>
                    <div className="space-y-6">
                        {posts.map((post) => {
                            const isAdminPost = post.authorRole === 'admin' || post.authorId === 'admin-1';
                            return (
                                <div key={post.id} className={`bg-white p-7 rounded-[2.5rem] border-2 relative overflow-hidden animate-in zoom-in-95 ${isAdminPost ? 'border-amber-400 shadow-[0_15px_40px_rgba(245,158,11,0.12)] bg-gradient-to-b from-white to-amber-50/20' : 'border-gray-50 shadow-sm'}`}>
                                    {isAdminPost && <div className="absolute top-0 right-0 left-0 h-1.5 bg-gradient-to-r from-amber-400 via-yellow-600 to-amber-400"></div>}
                                    <div className="flex items-center gap-4 mb-4">
                                        <div className={`w-13 h-13 rounded-2xl flex items-center justify-center text-white font-black text-2xl shadow-md p-3 ${isAdminPost ? UI_CONFIG.goldGradient : 'bg-[#2E1A47]'}`} style={{ backgroundColor: !isAdminPost ? (post.profileColor || '#2E1A47') : undefined }}>
                                            {isAdminPost ? <MotionIcon iconName="Crown" size={26} className="animate-icon-float" /> : String(post.authorName)?.[0]}
                                        </div>
                                        <div>
                                            <div className="flex items-center gap-2">
                                                <h4 className={`font-black text-base tracking-tight ${isAdminPost ? 'text-amber-700' : 'text-[#2E1A47]'}`}>{String(post.authorName)}</h4>
                                                {isAdminPost && <span className="bg-amber-100 text-amber-700 px-2 py-0.5 rounded-lg text-[9px] font-black uppercase tracking-tighter border border-amber-200">إدارة</span>}
                                            </div>
                                            <div className="flex items-center gap-1 text-[10px] text-gray-400 font-bold">
                                                <MotionIcon iconName="Clock" size={12} />
                                                <span>{new Date(post.timestamp).toLocaleString('ar-IQ')}</span>
                                            </div>
                                        </div>
                                    </div>
                                    <p className={`leading-relaxed whitespace-pre-wrap px-1 mb-5 font-bold ${isAdminPost ? 'text-[#2E1A47] text-base' : 'text-gray-700 text-sm'}`}>{String(post.content)}</p>
                                    <div className="flex items-center gap-4 border-t border-gray-100 pt-4">
                                        <button type="button" onClick={() => { setActiveCommentPost(activeCommentPost === post.id ? null : post.id); setActiveReplyToId(null); }} className={`flex items-center gap-2 px-5 py-2 rounded-xl transition-all font-black text-xs ${activeCommentPost === post.id ? 'bg-[#2E1A47] text-white shadow-lg' : 'bg-gray-50 text-gray-600 hover:bg-gray-100'}`}>
                                            <MotionIcon iconName="MessagesSquare" size={15} /> 
                                            <span>{post.comments?.length || 0} تعليقات</span>
                                        </button>
                                    </div>
                                    {activeCommentPost === post.id && (
                                        <div className="mt-5 animate-in slide-in-bottom">
                                            <div className="space-y-3 mb-4 max-h-72 overflow-y-auto custom-scrollbar">
                                                {(post.comments || []).map(comment => (
                                                    <div key={comment.id} className="space-y-2 group">
                                                        <div className="flex gap-2.5">
                                                            <div className="w-8 h-8 rounded-xl flex-shrink-0 flex items-center justify-center text-white text-xs font-black shadow-sm" style={{ backgroundColor: comment.profileColor || '#8B5CF6' }}>{String(comment.authorName)?.[0]}</div>
                                                            <div className="bg-gray-50 p-3.5 rounded-2xl rounded-tr-none flex-1 border border-gray-100 shadow-sm relative">
                                                                <div className="flex justify-between items-center mb-1">
                                                                    <span className="text-[11px] font-black text-[#2E1A47]">{String(comment.authorName)}</span>
                                                                    <div className="flex items-center gap-2">
                                                                        <span className="text-[9px] text-gray-400">{new Date(comment.timestamp).toLocaleTimeString('ar-IQ')}</span>
                                                                        {(comment.authorId === user.id || user.role === 'admin') && (
                                                                            <button 
                                                                                type="button" 
                                                                                onClick={() => onDeleteComment(post.id, comment.id)} 
                                                                                className="text-red-400 hover:text-red-600 p-1 transition-colors"
                                                                                title="حذف التعليق"
                                                                            >
                                                                                <MotionIcon iconName="Trash2" size={12} />
                                                                            </button>
                                                                        )}
                                                                    </div>
                                                                </div>
                                                                <p className="text-xs text-gray-700 leading-relaxed font-bold">{String(comment.text)}</p>
                                                                <button type="button" onClick={() => setActiveReplyToId(activeReplyToId === comment.id ? null : comment.id)} className="text-[10px] text-purple-600 font-black mt-2 flex items-center gap-1 hover:underline">
                                                                    <MotionIcon iconName="Reply" size={10} /> رد
                                                                </button>
                                                            </div>
                                                        </div>
                                                        {(comment.replies || []).map(reply => (
                                                            <div key={reply.id} className="flex gap-2.5 mr-10 animate-in fade-in slide-in-bottom group">
                                                                <div className="w-6 h-6 rounded-lg flex-shrink-0 flex items-center justify-center text-white text-[9px] font-black shadow-sm" style={{ backgroundColor: reply.profileColor || '#2E1A47' }}>{String(reply.authorName)?.[0]}</div>
                                                                <div className="bg-purple-50/70 p-3 rounded-2xl rounded-tr-none flex-1 border border-purple-100/50 text-xs text-purple-900 font-bold relative">
                                                                    <div className="flex justify-between items-center mb-1">
                                                                        <span className="text-[10px] font-black text-[#2E1A47]">{String(reply.authorName)}</span>
                                                                        {(reply.authorId === user.id || user.role === 'admin') && (
                                                                            <button 
                                                                                type="button" 
                                                                                onClick={() => onDeleteComment(post.id, comment.id, reply.id)} 
                                                                                className="text-red-400 hover:text-red-600 p-0.5 transition-colors"
                                                                                title="حذف الرد"
                                                                            >
                                                                                <MotionIcon iconName="Trash2" size={11} />
                                                                            </button>
                                                                        )}
                                                                    </div>
                                                                    {String(reply.text)}
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                ))}
                                            </div>
                                            <div className="flex gap-2">
                                                <input type="text" value={commentText} onChange={e => setCommentText(e.target.value)} onKeyDown={e => e.key === 'Enter' && (addComment(post.id, commentText, activeReplyToId), setCommentText(''), setActiveReplyToId(null))} placeholder={activeReplyToId ? "اكتب ردك..." : "اكتب تعليقك..."} className="flex-1 bg-gray-100 rounded-xl px-4 py-3 text-xs outline-none focus:ring-2 focus:ring-purple-200 font-bold" />
                                                <button type="button" onClick={() => { addComment(post.id, commentText, activeReplyToId); setCommentText(''); setActiveReplyToId(null); }} className="px-4 bg-[#2E1A47] text-white rounded-xl shadow-lg active:scale-95 transition-all">
                                                    <MotionIcon iconName="Send" size={16} className="rotate-180" />
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const MessagesView = ({ users, currentUser, messages, setMessages, groups, createGroup, deleteGroup, selectedTarget, setSelectedTarget }) => {
            const [searchQuery, setSearchQuery] = useState('');
            const [msg, setMsg] = useState('');
            const [showNewGroupModal, setShowNewGroupModal] = useState(false);
            const [newGroupName, setNewGroupName] = useState('');
            const [selectedMembers, setSelectedMembers] = useState([]);
            const chatEndRef = useRef(null);

            useEffect(() => { chatEndRef.current?.scrollIntoView({ behavior: "smooth" }); }, [messages, selectedTarget]);

            const pinnedUsers = useMemo(() => {
                const ids = new Set();
                messages.forEach(m => {
                    if (!m.groupId) {
                        if (m.from === currentUser.id) ids.add(m.to);
                        if (m.to === currentUser.id) ids.add(m.from);
                    }
                });
                return users.filter(u => ids.has(u.id) && u.id !== currentUser.id);
            }, [messages, users, currentUser]);

            const searchResults = useMemo(() => {
                const q = searchQuery.trim().toLowerCase();
                if (!q) return [];
                return users.filter(u => u.id !== currentUser.id && (u.name.toLowerCase().includes(q) || u.username.toLowerCase().includes(q)));
            }, [searchQuery, users, currentUser]);

            const myGroups = useMemo(() => {
                return (groups || []).filter(g => (g.members || []).includes(currentUser.id) || g.createdBy === currentUser.id);
            }, [groups, currentUser]);

            const conversation = useMemo(() => {
                if (!selectedTarget) return [];
                if (selectedTarget.isGroup) {
                    return messages.filter(m => m.groupId === selectedTarget.id).sort((a,b) => new Date(a.time) - new Date(b.time));
                } else {
                    return messages.filter(m => !m.groupId && ((m.from === currentUser.id && m.to === selectedTarget.id) || (m.from === selectedTarget.id && m.to === currentUser.id))).sort((a,b) => new Date(a.time) - new Date(b.time));
                }
            }, [messages, selectedTarget, currentUser]);

            const handleSend = () => {
                if (!msg.trim() || !selectedTarget) return;
                const newMsg = {
                    id: Date.now().toString(),
                    from: currentUser.id,
                    fromName: currentUser.name,
                    profileColor: currentUser.profileColor,
                    to: selectedTarget.isGroup ? null : selectedTarget.id,
                    groupId: selectedTarget.isGroup ? selectedTarget.id : null,
                    text: String(msg),
                    time: new Date().toISOString(),
                    read: false
                };
                setMessages([...messages, newMsg]);
                setMsg('');
            };

            const handleCreateGroup = (e) => {
                e.preventDefault();
                if (!newGroupName.trim()) return;
                const created = createGroup(newGroupName, selectedMembers);
                setSelectedTarget({ ...created, isGroup: true });
                setNewGroupName('');
                setSelectedMembers([]);
                setShowNewGroupModal(false);
            };

            return (
                <div className="bg-white rounded-[2.5rem] border border-gray-100 h-[calc(100vh-230px)] md:h-[calc(100vh-140px)] flex flex-col md:flex-row overflow-hidden shadow-sm animate-in fade-in relative">
                    {/* نافذة إنشاء مجموعة جديدة */}
                    {showNewGroupModal && (
                        <div className="fixed inset-0 z-[250] flex items-center justify-center p-5 bg-black/50 backdrop-blur-sm animate-in zoom-in-95">
                            <div className="bg-white rounded-[2rem] p-6 max-w-sm w-full shadow-2xl border">
                                <div className="flex justify-between items-center mb-4">
                                    <h4 className="font-black text-[#2E1A47] text-base flex items-center gap-2">
                                        <MotionIcon iconName="Users" size={18} className="text-purple-600" /> إنشاء مجموعة محادثة
                                    </h4>
                                    <button onClick={() => setShowNewGroupModal(false)} className="text-gray-400 hover:text-gray-600"><MotionIcon iconName="X" size={18}/></button>
                                </div>
                                <form onSubmit={handleCreateGroup} className="space-y-3">
                                    <input 
                                        type="text" 
                                        placeholder="اسم المجموعة..." 
                                        value={newGroupName} 
                                        onChange={e => setNewGroupName(e.target.value)} 
                                        className="w-full p-3 bg-gray-50 rounded-xl outline-none font-bold text-xs border"
                                        required
                                    />
                                    <div>
                                        <label className="text-[11px] font-bold text-gray-500 block mb-1">حدد الأعضاء:</label>
                                        <div className="max-h-40 overflow-y-auto space-y-1.5 custom-scrollbar border p-2 rounded-xl bg-gray-50/50">
                                            {users.filter(u => u.id !== currentUser.id).map(u => (
                                                <label key={u.id} className="flex items-center justify-between p-2 rounded-lg bg-white border text-xs cursor-pointer hover:bg-purple-50/30">
                                                    <span className="font-bold text-[#2E1A47]">{u.name} (@{u.username})</span>
                                                    <input 
                                                        type="checkbox" 
                                                        checked={selectedMembers.includes(u.id)}
                                                        onChange={(e) => {
                                                            if (e.target.checked) setSelectedMembers([...selectedMembers, u.id]);
                                                            else setSelectedMembers(selectedMembers.filter(id => id !== u.id));
                                                        }}
                                                        className="w-4 h-4 accent-purple-600 rounded"
                                                    />
                                                </label>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="flex gap-2 pt-2">
                                        <button type="submit" className="flex-1 py-3 bg-[#2E1A47] text-white rounded-xl font-black text-xs shadow-md">
                                            إنشاء المجموعة
                                        </button>
                                        <button type="button" onClick={() => setShowNewGroupModal(false)} className="px-4 py-3 bg-gray-100 text-gray-500 rounded-xl font-black text-xs">
                                            إلغاء
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* القائمة الجانبية للرسائل */}
                    <div className={`w-full md:w-80 border-l flex flex-col bg-gray-50/30 ${selectedTarget ? 'hidden md:flex' : 'flex'}`}>
                        <div className="p-5 bg-white border-b space-y-3">
                            <div className="flex items-center justify-between">
                                <h3 className="font-black text-base text-[#2E1A47] tracking-tight flex items-center gap-2">
                                    <MotionIcon iconName="MessageSquare" className="text-purple-600" size={18} /> الرسائل
                                </h3>
                                <button 
                                    onClick={() => setShowNewGroupModal(true)} 
                                    className="p-2 bg-purple-50 hover:bg-purple-100 text-purple-700 rounded-xl text-xs font-black flex items-center gap-1.5 transition-all"
                                    title="إنشاء مجموعة جديدة"
                                >
                                    <MotionIcon iconName="PlusCircle" size={15} />
                                    <span>مجموعة</span>
                                </button>
                            </div>
                            <div className="relative group">
                                <div className="absolute right-4 top-1/2 -translate-y-1/2">
                                    <MotionIcon iconName="Search" className="text-gray-400 group-focus-within:text-purple-500" size={16} />
                                </div>
                                <input 
                                    type="text" 
                                    placeholder="ابحث بالاسم أو اليوزر للمراسلة..." 
                                    className="w-full pr-10 pl-4 py-3 bg-gray-100 rounded-xl outline-none text-xs font-black focus:ring-2 focus:ring-purple-200" 
                                    value={searchQuery} 
                                    onChange={e => setSearchQuery(e.target.value)} 
                                />
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto p-3 space-y-2 custom-scrollbar">
                            {searchQuery.trim() ? (
                                <div>
                                    <span className="text-[10px] font-bold text-gray-400 px-3 pb-1 block">نتائج البحث:</span>
                                    {searchResults.length > 0 ? (
                                        searchResults.map(u => (
                                            <button 
                                                key={u.id} 
                                                onClick={() => { setSelectedTarget({ ...u, isGroup: false }); setSearchQuery(''); }} 
                                                className={`w-full p-3.5 flex items-center gap-3 rounded-2xl transition-all ${selectedTarget?.id === u.id && !selectedTarget?.isGroup ? 'bg-[#2E1A47] text-white shadow-xl' : 'hover:bg-gray-100 bg-white border border-gray-100'}`}
                                            >
                                                <div className="w-10 h-10 rounded-xl flex items-center justify-center font-black text-white shadow-sm" style={{ backgroundColor: u.profileColor || '#2E1A47' }}>{String(u.name)?.[0]}</div>
                                                <div className="text-right flex-1 overflow-hidden">
                                                    <p className="font-black text-xs truncate">{String(u.name)}</p>
                                                    <p className={`text-[10px] font-bold ${selectedTarget?.id === u.id && !selectedTarget?.isGroup ? 'text-purple-200' : 'text-gray-400'}`}>@{String(u.username)}</p>
                                                </div>
                                            </button>
                                        ))
                                    ) : (
                                        <p className="text-center text-gray-400 py-4 text-xs font-bold">لا يوجد مستخدم بهذا الاسم</p>
                                    )}
                                </div>
                            ) : (
                                <>
                                    {myGroups.length > 0 && (
                                        <div className="space-y-1 mb-3">
                                            <span className="text-[10px] font-bold text-gray-400 px-2 block">المجموعات</span>
                                            {myGroups.map(g => (
                                                <button 
                                                    key={g.id} 
                                                    onClick={() => setSelectedTarget({ ...g, isGroup: true })} 
                                                    className={`w-full p-3.5 flex items-center gap-3 rounded-2xl transition-all ${selectedTarget?.id === g.id && selectedTarget?.isGroup ? 'bg-[#2E1A47] text-white shadow-xl' : 'hover:bg-gray-100 bg-white border border-gray-100/70'}`}
                                                >
                                                    <div className="w-10 h-10 rounded-xl bg-purple-600 flex items-center justify-center text-white shadow-sm">
                                                        <MotionIcon iconName="Users" size={18} />
                                                    </div>
                                                    <div className="text-right flex-1 overflow-hidden">
                                                        <p className="font-black text-xs truncate">{String(g.name)}</p>
                                                        <p className={`text-[9px] font-bold ${selectedTarget?.id === g.id && selectedTarget?.isGroup ? 'text-purple-200' : 'text-gray-400'}`}>{(g.members?.length || 0) + 1} أعضاء</p>
                                                    </div>
                                                </button>
                                            ))}
                                        </div>
                                    )}

                                    <div className="space-y-1">
                                        <span className="text-[10px] font-bold text-gray-400 px-2 block">المحادثات المثبتة</span>
                                        {pinnedUsers.length > 0 ? (
                                            pinnedUsers.map(u => {
                                                const unreadCount = messages.filter(m => !m.groupId && m.from === u.id && m.to === currentUser.id && !m.read).length;
                                                return (
                                                    <button 
                                                        key={u.id} 
                                                        onClick={() => setSelectedTarget({ ...u, isGroup: false })} 
                                                        className={`w-full p-3.5 flex items-center gap-3 rounded-2xl transition-all ${selectedTarget?.id === u.id && !selectedTarget?.isGroup ? 'bg-[#2E1A47] text-white shadow-xl' : 'hover:bg-gray-100 bg-white border border-gray-100/70'}`}
                                                    >
                                                        <div className="w-10 h-10 rounded-xl flex items-center justify-center font-black text-white shadow-sm" style={{ backgroundColor: u.profileColor || '#2E1A47' }}>{String(u.name)?.[0]}</div>
                                                        <div className="text-right flex-1 overflow-hidden">
                                                            <p className="font-black text-xs truncate">{String(u.name)}</p>
                                                            <p className={`text-[9px] font-bold ${selectedTarget?.id === u.id && !selectedTarget?.isGroup ? 'text-purple-200' : 'text-gray-400'}`}>@{String(u.username)}</p>
                                                        </div>
                                                        {unreadCount > 0 && <span className="bg-red-500 text-white text-[9px] font-black px-2 py-0.5 rounded-full shadow-lg">{unreadCount}</span>}
                                                    </button>
                                                );
                                            })
                                        ) : (
                                            <div className="text-center py-8 px-4 text-gray-400">
                                                <MotionIcon iconName="Search" size={30} className="mx-auto mb-2 opacity-30" />
                                                <p className="text-xs font-bold">لا توجد محادثات سابقة</p>
                                                <p className="text-[10px] text-gray-400 mt-1">ابحث عن مستخدم أعلاه لبدء وتثبيت محادثة</p>
                                            </div>
                                        )}
                                    </div>
                                </>
                            )}
                        </div>
                    </div>

                    {/* منطقة الدردشة المفتوحة */}
                    <div className={`flex-1 flex flex-col bg-white ${!selectedTarget ? 'hidden md:flex items-center justify-center opacity-40' : 'flex'}`}>
                        {selectedTarget ? (
                            <>
                                <div className="p-4 border-b flex items-center justify-between bg-gray-50/70">
                                    <div className="flex items-center gap-3.5">
                                        <button onClick={() => setSelectedTarget(null)} className="md:hidden p-2 text-purple-600 hover:scale-110 transition-transform"><MotionIcon iconName="ChevronRight"/></button>
                                        <div className="w-10 h-10 rounded-xl flex items-center justify-center text-white font-black shadow-md" style={{ backgroundColor: selectedTarget.isGroup ? '#8B5CF6' : (selectedTarget.profileColor || '#2E1A47') }}>
                                            {selectedTarget.isGroup ? <MotionIcon iconName="Users" size={18} /> : String(selectedTarget.name)?.[0]}
                                        </div>
                                        <div>
                                            <h4 className="font-black text-sm text-[#2E1A47]">
                                                {String(selectedTarget.name)} {selectedTarget.isGroup ? '(مجموعة)' : `(@${selectedTarget.username})`}
                                            </h4>
                                            <p className="text-[9px] text-green-600 font-bold flex items-center gap-1">
                                                <span className="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span> 
                                                {selectedTarget.isGroup ? `${(selectedTarget.members?.length || 0) + 1} أعضاء بالمجموعة` : 'متصل'}
                                            </p>
                                        </div>
                                    </div>
                                    {selectedTarget.isGroup && (selectedTarget.createdBy === currentUser.id || currentUser.role === 'admin') && (
                                        <button 
                                            type="button" 
                                            onClick={() => deleteGroup(selectedTarget.id)} 
                                            className="p-2.5 bg-red-50 hover:bg-red-100 text-red-600 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-colors"
                                            title="إزالة المجموعة"
                                        >
                                            <MotionIcon iconName="Trash2" size={15} />
                                            <span className="hidden sm:inline">حذف المجموعة</span>
                                        </button>
                                    )}
                                </div>
                                <div className="flex-1 overflow-y-auto p-6 space-y-3.5 custom-scrollbar bg-[#FDFCF8]/40">
                                    {conversation.map(m => {
                                        const isMine = m.from === currentUser.id;
                                        return (
                                            <div key={m.id} className={`flex ${isMine ? 'justify-start' : 'justify-end'} animate-in zoom-in-95`}>
                                                <div className={`p-3.5 rounded-[1.6rem] max-w-[82%] shadow-sm border ${isMine ? 'bg-[#2E1A47] text-white rounded-br-none border-[#2E1A47]' : 'bg-white border-gray-100 text-[#2E1A47] rounded-bl-none'}`}>
                                                    {selectedTarget.isGroup && !isMine && (
                                                        <span className="text-[10px] font-black text-purple-600 block mb-1">{String(m.fromName || 'عضو')}</span>
                                                    )}
                                                    <p className="text-xs font-bold leading-relaxed">{String(m.text)}</p>
                                                    <span className={`text-[8px] opacity-60 block mt-1.5 font-bold ${isMine ? 'text-left' : 'text-right'}`}>
                                                        {new Date(m.time).toLocaleTimeString('ar-IQ')}
                                                    </span>
                                                </div>
                                            </div>
                                        );
                                    })}
                                    <div ref={chatEndRef} />
                                </div>
                                <div className="p-3.5 border-t flex gap-2 bg-white">
                                    <input 
                                        type="text" 
                                        placeholder="اكتب رسالتك هنا..." 
                                        className="flex-1 p-3 px-4 bg-gray-50 rounded-xl outline-none text-xs font-bold focus:ring-2 focus:ring-purple-200" 
                                        value={msg} 
                                        onChange={e => setMsg(e.target.value)} 
                                        onKeyDown={e => e.key === 'Enter' && handleSend()} 
                                    />
                                    <button onClick={handleSend} className="w-11 h-11 flex items-center justify-center bg-[#2E1A47] text-white rounded-xl shadow-lg active:scale-95 transition-all">
                                        <MotionIcon iconName="Send" size={17} className="rotate-180"/>
                                    </button>
                                </div>
                            </>
                        ) : (
                            <div className="text-center p-6">
                                <MotionIcon iconName="MessageSquare" size={54} className="mx-auto mb-3 text-purple-300 animate-icon-float" />
                                <p className="font-black text-base text-[#2E1A47]">المراسلات</p>
                                <p className="text-xs text-gray-400 mt-1">ابحث عن شخص أو افتح مجموعة لبدء المحادثة</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const BankView = ({ user, users, onTransfer, onOpenLoanModal, userLoans }) => {
            const [recipient, setRecipient] = useState('');
            const [amount, setAmount] = useState('');
            const [feedback, setFeedback] = useState(null);

            const handleSendCoins = (e) => {
                e.preventDefault();
                setFeedback(null);
                const res = onTransfer(recipient, parseFloat(amount));
                if (res.success) {
                    setFeedback({ type: 'success', msg: res.msg });
                    setRecipient(''); setAmount('');
                } else {
                    setFeedback({ type: 'error', msg: res.msg });
                }
            };

            const userHistory = (user?.history || []).slice().reverse();
            const myPendingLoans = (userLoans || []).filter(l => l.userId === user?.id && l.status === 'pending');

            return (
                <div className="space-y-6 animate-in fade-in slide-in-bottom pb-24">
                    <div className="rounded-[3rem] p-8 text-white relative overflow-hidden shadow-2xl bg-gradient-to-br from-[#1E1131] via-[#2E1A47] to-[#472275] border border-amber-400/30">
                        <div className="absolute top-0 right-0 w-64 h-64 bg-amber-400/10 rounded-full blur-3xl -mr-20 -mt-20"></div>
                        <div className="relative z-10 flex flex-col items-center text-center">
                            <span className="text-[11px] font-black uppercase tracking-widest text-amber-300/80 mb-1 flex items-center gap-1.5">
                                <MotionIcon iconName="Coins" size={15} className="text-amber-400" /> الرصيد المتاح
                            </span>
                            <div className="my-3 flex items-baseline justify-center gap-2">
                                <span className="text-5xl md:text-6xl font-black text-amber-400 tracking-tight drop-shadow-md">
                                    {user?.role === 'admin' ? "∞" : Number(user?.balance || 0).toFixed(2)}
                                </span>
                                <span className="text-lg font-black text-purple-200">كوين</span>
                            </div>
                            <div className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/10 backdrop-blur-md border border-white/10 text-xs font-bold text-amber-300">
                                <span className="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
                                محفظة نشطة
                            </div>
                        </div>
                    </div>

                    <div className="bg-white p-7 rounded-[2.5rem] border border-gray-100 shadow-sm space-y-4">
                        <div className="flex items-center gap-3 mb-2">
                            <div className="p-3 bg-amber-50 text-amber-600 rounded-2xl">
                                <MotionIcon iconName="Send" size={20} className="rotate-180" />
                            </div>
                            <div>
                                <h3 className="font-black text-base text-[#2E1A47]">إرسال عملات</h3>
                                <p className="text-[11px] text-gray-400 font-bold">تحويل رصيد لأي مستخدم باسم المستخدم</p>
                            </div>
                        </div>

                        {feedback && (
                            <div className={`p-4 rounded-2xl text-xs font-black ${feedback.type === 'success' ? 'bg-green-50 text-green-700 border border-green-200' : 'bg-red-50 text-red-700 border border-red-200 animate-shake'}`}>
                                {feedback.msg}
                            </div>
                        )}

                        <form onSubmit={handleSendCoins} className="space-y-3">
                            <div className="relative">
                                <div className="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 font-bold text-sm">@</div>
                                <input 
                                    type="text" 
                                    placeholder="اسم مستخدم المستلم..." 
                                    value={recipient} 
                                    onChange={e => setRecipient(e.target.value)} 
                                    className="w-full pr-10 pl-4 py-3.5 bg-gray-50 rounded-2xl outline-none font-bold text-sm border border-gray-100 focus:ring-2 focus:ring-amber-300"
                                />
                            </div>
                            <div className="relative">
                                <div className="absolute right-4 top-1/2 -translate-y-1/2">
                                    <MotionIcon iconName="Coins" size={18} className="text-amber-500" />
                                </div>
                                <input 
                                    type="number" 
                                    placeholder="المبلغ (بالكوين)" 
                                    step="0.01" 
                                    value={amount} 
                                    onChange={e => setAmount(e.target.value)} 
                                    className="w-full pr-12 pl-4 py-3.5 bg-gray-50 rounded-2xl outline-none font-bold text-sm border border-gray-100 focus:ring-2 focus:ring-amber-300"
                                />
                            </div>
                            <button type="submit" className="w-full py-4 bg-gradient-to-r from-amber-500 to-amber-600 text-[#2E1A47] font-black rounded-2xl shadow-lg hover:shadow-xl active:scale-98 transition-all flex items-center justify-center gap-2">
                                <MotionIcon iconName="Send" size={18} className="rotate-180" />
                                <span>تأكيد الإرسال</span>
                            </button>
                        </form>
                    </div>

                    <div className="bg-white p-7 rounded-[2.5rem] border border-gray-100 shadow-sm space-y-4">
                        <div className="flex items-center gap-3">
                            <div className="p-3 bg-purple-50 text-purple-700 rounded-2xl">
                                <MotionIcon iconName="Wallet" size={20} />
                            </div>
                            <div>
                                <h3 className="font-black text-base text-[#2E1A47]">طلب تمويل رصيد</h3>
                                <p className="text-[11px] text-gray-400 font-bold">إرسال طلب موافقة للمسؤول لشحن الحساب</p>
                            </div>
                        </div>

                        {myPendingLoans.length > 0 && (
                            <div className="p-3 bg-amber-50 text-amber-800 border border-amber-200 rounded-2xl text-xs font-bold">
                                لديك طلب تمويل قيد المراجعة لدى الإدارة بقيمة: {myPendingLoans[0].amount} كوين
                            </div>
                        )}

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                            <div onClick={() => onOpenLoanModal(100)} className="p-4 bg-gradient-to-r from-amber-50/60 to-purple-50/40 border border-amber-200/60 rounded-2xl flex items-center justify-between cursor-pointer hover:border-amber-400 transition-all group shadow-sm">
                                <div>
                                    <span className="font-black text-sm text-[#2E1A47] block group-hover:text-amber-600 transition-colors">تمويل (100 كوين)</span>
                                    <span className="text-[10px] text-gray-400 font-bold">طلب موافقة الإدارة</span>
                                </div>
                                <span className="p-2.5 bg-amber-400 text-[#2E1A47] rounded-xl text-xs font-black"><i className="fa-solid fa-coins"></i></span>
                            </div>
                            <div onClick={() => onOpenLoanModal(250)} className="p-4 bg-gradient-to-r from-amber-50/60 to-purple-50/40 border border-amber-200/60 rounded-2xl flex items-center justify-between cursor-pointer hover:border-amber-400 transition-all group shadow-sm">
                                <div>
                                    <span className="font-black text-sm text-[#2E1A47] block group-hover:text-amber-600 transition-colors">تمويل (250 كوين)</span>
                                    <span className="text-[10px] text-gray-400 font-bold">طلب موافقة الإدارة</span>
                                </div>
                                <span className="p-2.5 bg-amber-500 text-white rounded-xl text-xs font-black"><i className="fa-solid fa-vault"></i></span>
                            </div>
                        </div>
                    </div>

                    <div className="bg-white p-7 rounded-[2.5rem] border border-gray-100 shadow-sm space-y-4">
                        <div className="flex items-center justify-between border-b border-gray-100 pb-3">
                            <h3 className="font-black text-base text-[#2E1A47] flex items-center gap-2">
                                <MotionIcon iconName="FileText" size={18} className="text-purple-600" /> السجل المالي
                            </h3>
                            <span className="text-[11px] text-gray-400 font-bold">العمليات السابقة</span>
                        </div>
                        <div className="space-y-2.5 max-h-72 overflow-y-auto custom-scrollbar">
                            {userHistory.length > 0 ? (
                                userHistory.map((h, i) => {
                                    const isIn = h.type === 'in';
                                    return (
                                        <div key={i} className="flex items-center justify-between p-3.5 bg-gray-50/70 hover:bg-gray-100/70 rounded-2xl transition-colors">
                                            <div className="flex items-center gap-3">
                                                <div className={`w-9 h-9 rounded-xl flex items-center justify-center font-bold text-xs ${isIn ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>
                                                    <MotionIcon iconName={isIn ? "ArrowDownLeft" : "ArrowUpRight"} size={16} />
                                                </div>
                                                <div>
                                                    <p className="font-black text-xs text-[#2E1A47]">{h.msg}</p>
                                                    <span className="text-[9px] text-gray-400 font-bold">{h.time || '--:--'}</span>
                                                </div>
                                            </div>
                                            <div className={`font-black text-sm ${isIn ? 'text-green-600' : 'text-red-600'}`} dir="ltr">
                                                {isIn ? '+' : '-'}{Number(h.amount).toFixed(2)}
                                            </div>
                                        </div>
                                    );
                                })
                            ) : (
                                <p className="text-center text-gray-400 py-6 text-xs font-bold">لا توجد عمليات مسجلة بعد</p>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const ProfileView = ({ user, posts, updateProfile, onDeletePost, onLogout }) => {
            const [isEditing, setIsEditing] = useState(false);
            const [name, setName] = useState(user?.name || '');
            const [bio, setBio] = useState(user?.bio || '');
            const [color, setColor] = useState(user?.profileColor || '#2E1A47');
            const [password, setPassword] = useState(''); 
            const userPosts = useMemo(() => posts.filter(p => p.authorId === user?.id), [posts, user]);

            return (
                <div className="max-w-2xl mx-auto space-y-6 animate-in fade-in slide-in-bottom pb-28">
                    <div className="bg-white rounded-[3rem] overflow-hidden border shadow-sm relative">
                        <div className="h-44 relative transition-colors duration-500" style={{ backgroundColor: user?.profileColor || '#2E1A47' }}>
                            <div className="absolute -bottom-10 right-10 w-32 h-32 rounded-[2.5rem] bg-white p-1.5 shadow-2xl">
                                <div className="w-full h-full rounded-[2.2rem] flex items-center justify-center text-white text-4xl font-black shadow-inner" style={{ backgroundColor: user?.profileColor || '#2E1A47' }}>
                                    {String(user?.name)?.[0]}
                                </div>
                            </div>
                        </div>
                        <div className="pt-16 p-8">
                            {!isEditing ? (
                                <div className="space-y-4">
                                    <div className="flex justify-between items-center">
                                        <div>
                                            <h2 className="text-3xl font-black text-[#2E1A47] tracking-tight">{String(user?.name)}</h2>
                                            <p className="text-purple-600 font-bold text-sm mt-0.5">@{String(user?.username)}</p>
                                        </div>
                                        <button onClick={() => setIsEditing(true)} className="p-3.5 bg-purple-50 text-purple-700 rounded-2xl hover:scale-105 transition-all shadow-sm">
                                            <MotionIcon iconName="Settings" size={20}/>
                                        </button>
                                    </div>
                                    <div className="bg-gray-50 p-6 rounded-2xl border italic text-gray-600 font-bold text-xs leading-relaxed">
                                        {String(user?.bio || 'لا توجد نبذة شخصية مسجلة بعد.')}
                                    </div>
                                    <div className="flex gap-4 pt-2">
                                        <div className="p-3 bg-purple-50/60 rounded-xl flex-1 text-center">
                                            <span className="text-[10px] text-gray-500 font-bold block">رصيد الكوينز</span>
                                            <span className="text-base font-black text-amber-600">{user?.role === 'admin' ? "∞" : Number(user?.balance || 0).toFixed(2)}</span>
                                        </div>
                                        <div className="p-3 bg-purple-50/60 rounded-xl flex-1 text-center">
                                            <span className="text-[10px] text-gray-500 font-bold block">المنشورات</span>
                                            <span className="text-base font-black text-[#2E1A47]">{userPosts.length}</span>
                                        </div>
                                    </div>

                                    {/* زر تسجيل الخروج في الملف الشخصي مخصص لشاشات الهاتف */}
                                    <div className="md:hidden pt-4 border-t border-gray-100">
                                        <button 
                                            type="button" 
                                            onClick={onLogout} 
                                            className="w-full py-3.5 bg-red-50 hover:bg-red-100 active:scale-[0.98] text-red-600 rounded-2xl font-black text-sm flex items-center justify-center gap-2 border border-red-100 transition-all shadow-sm"
                                        >
                                            <MotionIcon iconName="LogOut" size={18} />
                                            <span>تسجيل الخروج</span>
                                        </button>
                                    </div>
                                </div>
                            ) : (
                                <div className="space-y-4 animate-in fade-in">
                                    <input type="text" value={name} onChange={e => setName(e.target.value)} className="w-full p-4 bg-gray-50 rounded-2xl border outline-none font-bold text-sm focus:ring-2 focus:ring-purple-200" placeholder="الاسم الكامل" />
                                    <textarea value={bio} onChange={e => setBio(e.target.value)} className="w-full p-4 bg-gray-50 rounded-2xl border h-24 outline-none resize-none font-bold text-sm focus:ring-2 focus:ring-purple-200" placeholder="النبذة الشخصية" />
                                    <div className="relative group">
                                        <input type="password" value={password} onChange={e => setPassword(e.target.value)} className="w-full p-4 bg-gray-50 rounded-2xl border outline-none font-bold text-sm focus:ring-2 focus:ring-purple-200" placeholder="كلمة المرور الجديدة (اتركها فارغة إن لم ترغب بالتغيير)" />
                                    </div>
                                    <div className="flex gap-3 justify-center py-2">
                                        {['#2E1A47', '#8B5CF6', '#EF4444', '#10B981', '#F59E0B'].map(c => (
                                            <button key={c} onClick={() => setColor(c)} className={`w-9 h-9 rounded-xl border-2 transition-all ${color === c ? 'border-purple-300 scale-110 shadow-md ring-2 ring-purple-600' : 'border-transparent opacity-60'}`} style={{ backgroundColor: c }} />
                                        ))}
                                    </div>
                                    <div className="flex gap-3">
                                        <button onClick={() => { updateProfile({ name, bio, profileColor: color, ...(password.trim() && { password }) }); setIsEditing(false); setPassword(''); }} className="flex-1 py-4 bg-[#2E1A47] text-white rounded-2xl font-black shadow-xl active:scale-95 transition-all text-sm">
                                            حفظ التعديلات
                                        </button>
                                        <button onClick={() => setIsEditing(false)} className="px-6 py-4 bg-gray-100 text-gray-500 rounded-2xl font-black text-sm">إلغاء</button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                    <div className="space-y-3">
                        <h3 className="font-black px-4 text-[#2E1A47] text-base flex items-center gap-2">
                            <MotionIcon iconName="FileText" size={18} className="text-purple-600" /> أرشيف منشوراتي
                        </h3>
                        {userPosts.length > 0 ? userPosts.map(p => (
                            <div key={p.id} className="bg-white p-5 rounded-2xl border flex justify-between items-center group shadow-sm hover:border-purple-200 transition-all">
                                <div className="flex-1">
                                    <p className="text-xs font-bold text-gray-700 line-clamp-1">{String(p.content)}</p>
                                    <span className="text-[9px] text-gray-400 font-bold">{new Date(p.timestamp).toLocaleDateString('ar-IQ')}</span>
                                </div>
                                <button onClick={() => onDeletePost(p.id)} className="p-3 bg-red-50 text-red-600 rounded-xl hover:bg-red-600 hover:text-white transition-all shadow-sm">
                                    <MotionIcon iconName="Trash2" size={16}/>
                                </button>
                            </div>
                        )) : <div className="text-center py-8 text-gray-400 font-bold text-xs opacity-60">لا توجد منشورات حتى الآن.</div>}
                    </div>
                </div>
            );
        };

        const AdminView = ({ users, setUsers, posts, onDeletePost, adminTab, setAdminTab, loginLogs, onAdjustCoins, loanRequests, onApproveLoan, onRejectLoan }) => {
            const [showPass, setShowPass] = useState({});
            const [alertText, setAlertText] = useState('');
            const [selectedUserAlert, setSelectedUserAlert] = useState(null);
            const [editingPassUserId, setEditingPassUserId] = useState(null);
            const [newPassInput, setNewPassInput] = useState('');
            const [coinInputs, setCoinInputs] = useState({});

            const updateUser = (id, fields) => setUsers(prev => prev.map(u => u.id === id ? { ...u, ...fields } : u));
            
            const sendAlert = () => {
                if (!alertText.trim() || !selectedUserAlert) return;
                updateUser(selectedUserAlert, { alert: alertText });
                setAlertText(''); setSelectedUserAlert(null);
            };

            const handleResetPassword = (userId) => {
                if (!newPassInput.trim()) return;
                updateUser(userId, { password: newPassInput });
                setEditingPassUserId(null); setNewPassInput('');
            };

            const totalCoins = useMemo(() => {
                return users.reduce((acc, curr) => acc + (parseFloat(curr.balance) || 0), 0);
            }, [users]);

            const pendingLoansCount = useMemo(() => {
                return (loanRequests || []).filter(l => l.status === 'pending').length;
            }, [loanRequests]);

            return (
                <div className="space-y-6 pb-28 animate-in fade-in">
                    <div className="bg-white rounded-[3rem] p-7 md:p-9 border shadow-sm relative overflow-hidden">
                        <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
                            <div className="flex items-center gap-4">
                                <div className="p-4 bg-purple-100 rounded-2xl text-[#2E1A47] shadow-md active-pulse">
                                    <MotionIcon iconName="ShieldCheck" size={32} />
                                </div>
                                <div>
                                    <h2 className="text-2xl md:text-3xl font-black text-[#2E1A47] tracking-tight">لوحة تحكم الإدارة</h2>
                                    <p className="text-xs text-gray-400 font-bold mt-0.5">إدارة المستخدمين، الأرصدة وطلبات التمويل، والمحتوى</p>
                                </div>
                            </div>
                            <div className="flex gap-3 bg-gray-50 p-3 rounded-2xl border">
                                <div className="text-center px-3 border-l border-gray-200">
                                    <span className="text-[10px] text-gray-400 font-bold block">إجمالي الأعضاء</span>
                                    <span className="text-lg font-black text-[#2E1A47]">{users.length}</span>
                                </div>
                                <div className="text-center px-3">
                                    <span className="text-[10px] text-gray-400 font-bold block">السيولة الإجمالية</span>
                                    <span className="text-lg font-black text-amber-600">{totalCoins.toFixed(2)}</span>
                                </div>
                            </div>
                        </div>
                        
                        <div className="flex bg-gray-100 p-1.5 rounded-2xl mb-8 overflow-x-auto gap-1.5 custom-scrollbar">
                            {[
                                { id: 'users', label: 'المستخدمين والأرصدة', icon: 'User' },
                                { id: 'loans', label: `طلبات التمويل ${pendingLoansCount > 0 ? `(${pendingLoansCount})` : ''}`, icon: 'Wallet' },
                                { id: 'content', label: 'إدارة المنشورات', icon: 'Database' },
                                { id: 'logs', label: 'سجلات الدخول', icon: 'Fingerprint' },
                                { id: 'alerts', label: 'التنبيهات', icon: 'ShieldAlert' }
                            ].map(t => (
                                <button key={t.id} onClick={() => setAdminTab(t.id)} className={`flex-1 py-3 px-4 rounded-xl font-black transition-all text-xs min-w-[130px] flex items-center justify-center gap-2 ${adminTab === t.id ? 'bg-white text-[#2E1A47] shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}>
                                    <MotionIcon iconName={t.icon} size={16} /> 
                                    <span>{t.label}</span>
                                </button>
                            ))}
                        </div>

                        {adminTab === 'users' && (
                            <div className="space-y-4 animate-in slide-in-bottom">
                                {users.map(u => (
                                    <div key={u.id} className="p-5 bg-gray-50/70 rounded-3xl border flex flex-col gap-4 hover:border-purple-200 transition-colors">
                                        <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                                            <div className="flex items-center gap-4">
                                                <div className="w-13 h-13 rounded-2xl flex items-center justify-center text-white font-black text-xl shadow-md p-3" style={{ backgroundColor: u.profileColor || '#2E1A47' }}>{String(u.name)?.[0]}</div>
                                                <div>
                                                    <div className="flex items-center gap-2">
                                                        <p className="font-black text-[#2E1A47] text-base">{String(u.name)}</p>
                                                        {u.role === 'admin' && <span className="bg-purple-100 text-[#2E1A47] text-[9px] font-black px-2 py-0.5 rounded-md">مسؤول</span>}
                                                    </div>
                                                    <p className="text-[11px] text-gray-400 font-bold mt-0.5">@{String(u.username)} • رصيد: <b className="text-amber-600 font-black">{Number(u.balance || 0).toFixed(2)} كوين</b></p>
                                                </div>
                                            </div>
                                            <div className="flex flex-wrap items-center gap-2 justify-end">
                                                <div className="flex items-center gap-1 bg-white px-3 py-1.5 rounded-xl border text-xs">
                                                    <span className="font-mono font-bold text-purple-700">{showPass[u.id] ? String(u.password) : '••••••••'}</span>
                                                    <button onClick={() => setShowPass({...showPass, [u.id]: !showPass[u.id]})} className="p-1 text-gray-400 hover:text-purple-600">
                                                        <MotionIcon iconName={showPass[u.id] ? "EyeOff" : "Eye"} size={15}/>
                                                    </button>
                                                    <button onClick={() => setEditingPassUserId(editingPassUserId === u.id ? null : u.id)} className="p-1 text-gray-400 hover:text-blue-600">
                                                        <MotionIcon iconName="KeyRound" size={15}/>
                                                    </button>
                                                </div>
                                                {u.role !== 'admin' && (
                                                    <div className="flex gap-2">
                                                        <button onClick={() => updateUser(u.id, { status: u.status === 'active' ? 'banned' : 'active' })} className={`px-3 py-2 rounded-xl text-xs font-black transition-all ${u.status === 'active' ? 'bg-red-50 text-red-600 border border-red-200' : 'bg-red-600 text-white'}`}>
                                                            {u.status === 'active' ? 'حظر الحساب' : 'فك الحظر'}
                                                        </button>
                                                    </div>
                                                )}
                                            </div>
                                        </div>

                                        <div className="flex items-center gap-2 pt-2 border-t border-gray-100">
                                            <span className="text-[11px] font-bold text-gray-500 min-w-fit">التحكم بالرصيد:</span>
                                            <input 
                                                type="number" 
                                                placeholder="المبلغ" 
                                                className="w-28 p-2 bg-white rounded-xl border text-xs font-bold outline-none" 
                                                value={coinInputs[u.id] || ''} 
                                                onChange={e => setCoinInputs({ ...coinInputs, [u.id]: e.target.value })}
                                            />
                                            <button onClick={() => { onAdjustCoins(u.id, parseFloat(coinInputs[u.id] || 0)); setCoinInputs({ ...coinInputs, [u.id]: '' }); }} className="px-3 py-2 bg-amber-500 text-white rounded-xl text-xs font-black shadow-sm hover:bg-amber-600">
                                                + إضافة
                                            </button>
                                            <button onClick={() => { onAdjustCoins(u.id, -parseFloat(coinInputs[u.id] || 0)); setCoinInputs({ ...coinInputs, [u.id]: '' }); }} className="px-3 py-2 bg-red-100 text-red-700 rounded-xl text-xs font-black hover:bg-red-200">
                                                - خصم
                                            </button>
                                        </div>

                                        {editingPassUserId === u.id && (
                                            <div className="flex gap-2 items-center bg-white p-3 rounded-2xl border-2 border-purple-200 animate-in slide-in-bottom">
                                                <input type="text" placeholder="كلمة المرور الجديدة..." className="flex-1 bg-gray-50 p-2.5 rounded-xl text-xs outline-none font-bold" value={newPassInput} onChange={e => setNewPassInput(e.target.value)} />
                                                <button onClick={() => handleResetPassword(u.id)} className="p-2.5 bg-[#2E1A47] text-white rounded-xl text-xs font-bold">
                                                    حفظ
                                                </button>
                                                <button onClick={() => setEditingPassUserId(null)} className="p-2.5 bg-gray-100 text-gray-500 rounded-xl text-xs">
                                                    إلغاء
                                                </button>
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        )}

                        {adminTab === 'loans' && (
                            <div className="space-y-4 animate-in slide-in-bottom">
                                <h4 className="font-black text-[#2E1A47] text-sm px-2">طلبات التمويل الواردة للموافقة</h4>
                                {(loanRequests || []).length > 0 ? (
                                    loanRequests.map(loan => {
                                        const reqUser = users.find(u => u.id === loan.userId);
                                        const isPending = loan.status === 'pending';
                                        return (
                                            <div key={loan.id} className="p-4 bg-white border border-gray-100 rounded-2xl shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                                <div>
                                                    <div className="flex items-center gap-2">
                                                        <span className="font-black text-sm text-[#2E1A47]">{reqUser?.name || 'مستخدم'}</span>
                                                        <span className="text-[10px] text-gray-400">@{reqUser?.username}</span>
                                                        <span className={`px-2 py-0.5 rounded-md text-[9px] font-black ${isPending ? 'bg-amber-100 text-amber-700' : (loan.status === 'approved' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700')}`}>
                                                            {isPending ? 'قيد الانتظار' : (loan.status === 'approved' ? 'تمت الموافقة' : 'مرفوض')}
                                                        </span>
                                                    </div>
                                                    <p className="text-xs font-bold text-gray-600 mt-1">
                                                        المبلغ المطلوب: <b className="text-amber-600 font-black">{loan.amount} كوين</b> • {new Date(loan.time).toLocaleTimeString('ar-IQ')}
                                                    </p>
                                                </div>
                                                {isPending ? (
                                                    <div className="flex items-center gap-2">
                                                        <button 
                                                            onClick={() => onApproveLoan(loan.id)} 
                                                            className="px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded-xl text-xs font-black shadow-sm flex items-center gap-1"
                                                        >
                                                            <MotionIcon iconName="Check" size={14} /> موافقة وشحن
                                                        </button>
                                                        <button
