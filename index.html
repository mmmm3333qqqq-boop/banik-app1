                                                            onClick={() => onRejectLoan(loan.id)} 
                                                            className="px-4 py-2 bg-red-100 hover:bg-red-200 text-red-700 rounded-xl text-xs font-black"
                                                        >
                                                            رفض
                                                        </button>
                                                    </div>
                                                ) : (
                                                    <span className="text-[10px] text-gray-400 font-bold">تمت المعالجة</span>
                                                )}
                                            </div>
                                        );
                                    })
                                ) : (
                                    <div className="text-center py-10 text-gray-400 text-xs font-bold">لا توجد طلبات تمويل واردة</div>
                                )}
                            </div>
                        )}

                        {adminTab === 'content' && (
                            <div className="space-y-3 animate-in slide-in-bottom">
                                <div className="flex items-center justify-between mb-4 px-2">
                                    <h4 className="font-black text-[#2E1A47] text-sm">سجل المنشورات العام ({posts.length})</h4>
                                </div>
                                {posts.map(p => (
                                    <div key={p.id} className="p-5 bg-white border border-gray-100 rounded-2xl flex justify-between items-center group shadow-sm hover:border-red-100 transition-all">
                                        <div className="flex-1 text-right pl-4">
                                            <p className="font-black text-[#2E1A47] text-xs mb-1">{p.authorName} <span className="text-gray-400 font-bold text-[10px]">({new Date(p.timestamp).toLocaleString('ar-IQ')})</span></p>
                                            <p className="text-xs text-gray-600 font-bold leading-relaxed line-clamp-2">{p.content}</p>
                                        </div>
                                        <button onClick={() => onDeletePost(p.id)} className="p-3 bg-red-50 text-red-600 rounded-xl hover:bg-red-600 hover:text-white transition-all shadow-sm">
                                            <MotionIcon iconName="Trash2" size={18} />
                                        </button>
                                    </div>
                                ))}
                            </div>
                        )}

                        {adminTab === 'logs' && (
                            <div className="space-y-3 animate-in slide-in-bottom">
                                <h4 className="font-black text-red-600 flex items-center gap-2 mb-4 px-2 text-base">
                                    <MotionIcon iconName="Fingerprint" size={20}/> سجلات الوصول
                                </h4>
                                {loginLogs.map(log => (
                                    <div key={log.id} className="p-4 bg-white border rounded-2xl flex items-center justify-between shadow-sm">
                                        <div className="flex items-center gap-3.5 text-right">
                                            <div className="p-3 bg-purple-50 text-purple-700 rounded-xl"><MotionIcon iconName="Activity" size={18}/></div>
                                            <div>
                                                <p className="text-sm font-black text-[#2E1A47]">{String(log.userName)}</p>
                                                <div className="flex items-center gap-2 mt-1 font-bold">
                                                    <span className="text-[10px] bg-gray-100 px-2.5 py-0.5 rounded-md text-gray-600">{String(log.device)}</span>
                                                    <span className="text-[10px] bg-purple-50 text-purple-700 px-2.5 py-0.5 rounded-md border border-purple-100">{String(log.ip)}</span>
                                                </div>
                                            </div>
                                        </div>
                                        <div className="text-left opacity-50 text-[10px] font-bold">
                                            {new Date(log.time).toLocaleTimeString('ar-IQ')}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {adminTab === 'alerts' && (
                            <div className="space-y-4 animate-in slide-in-bottom">
                                <div className="bg-red-50/70 p-6 rounded-3xl border border-red-100 relative">
                                    <h4 className="font-black text-red-800 mb-4 flex items-center gap-2 text-lg">
                                        <MotionIcon iconName="ShieldAlert" size={22}/> إرسال تنبيه للمستخدم
                                    </h4>
                                    <select className="w-full p-4 bg-white rounded-2xl border outline-none mb-3 text-xs font-black shadow-sm" value={selectedUserAlert || ''} onChange={e => setSelectedUserAlert(e.target.value)}>
                                        <option value="">اختر الحساب لإرسال التنبيه...</option>
                                        {users.filter(u => u.role !== 'admin').map(u => <option key={u.id} value={u.id}>{String(u.name)} (@{String(u.username)})</option>)}
                                    </select>
                                    <textarea placeholder="اكتب نص التنبيه أو التوجيه..." className="w-full p-4 bg-white rounded-2xl border h-32 outline-none text-xs font-bold resize-none mb-4 shadow-sm" value={alertText} onChange={e => setAlertText(e.target.value)} />
                                    <button onClick={sendAlert} disabled={!alertText.trim() || !selectedUserAlert} className="w-full py-4 bg-red-600 text-white rounded-2xl font-black shadow-xl active:scale-95 disabled:opacity-40 transition-all text-sm flex items-center justify-center gap-2">
                                        <MotionIcon iconName="Send" className="rotate-180" size={17} />
                                        <span>إرسال التنبيه الآن</span>
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('login'); 
            const [users, setUsers] = useState([]);
            const [posts, setPosts] = useState([]);
            const [messages, setMessages] = useState([]);
            const [groups, setGroups] = useState([]);
            const [loanRequests, setLoanRequests] = useState([]);
            const [loginLogs, setLoginLogs] = useState([]);
            const [activeAlert, setActiveAlert] = useState(null);
            const [isLoaded, setIsLoaded] = useState(false);

            const [selectedChatTarget, setSelectedChatTarget] = useState(null);
            const [activeCommentPost, setActiveCommentPost] = useState(null);
            const [activeReplyToId, setActiveReplyToId] = useState(null);
            const [adminTab, setAdminTab] = useState('users');
            const [loanModalAmount, setLoanModalAmount] = useState(null);

            const unreadMessagesCount = useMemo(() => {
                if (!user) return 0;
                return messages.filter(m => !m.groupId && m.to === user.id && !m.read).length;
            }, [messages, user]);

            // الربط الحي مع Firebase Realtime Database
            const rtdb = useMemo(() => {
                if (typeof firebase !== 'undefined' && firebase.apps.length) {
                    try {
                        return firebase.database();
                    } catch (e) {
                        console.warn("RTDB initialization error:", e);
                    }
                }
                return null;
            }, []);

            useEffect(() => {
                const safeParse = (key, fallback) => {
                    try {
                        const item = localStorage.getItem(key);
                        return item ? JSON.parse(item) : fallback;
                    } catch (e) { return fallback; }
                };

                const storageVersion = 'v_risala_unified_v2';
                const savedUsers = safeParse(`app_users_${storageVersion}`, []);
                const savedPosts = safeParse(`app_posts_${storageVersion}`, []);
                const savedMsgs = safeParse(`app_msgs_${storageVersion}`, []);
                const savedGroups = safeParse(`app_groups_${storageVersion}`, []);
                const savedLoans = safeParse(`app_loans_${storageVersion}`, []);
                const savedLogs = safeParse(`app_logs_${storageVersion}`, []);
                
                if (savedUsers.length === 0) {
                    savedUsers.push({
                        id: 'admin-1',
                        name: 'مدير النظام',
                        username: 'admin',
                        password: '123',
                        role: 'admin',
                        status: 'active',
                        balance: 999999,
                        history: [
                            { type: 'in', msg: 'افتتاح محفظة الإدارة', amount: 999999, time: new Date().toLocaleTimeString('ar-IQ') }
                        ],
                        profileColor: '#2E1A47',
                        alert: null,
                        bio: 'إدارة تطبيق رسالة ومتابعة المدفوعات والطلبات.',
                        ip: '127.0.0.1',
                        device: 'النظام'
                    });
                }

                setUsers(savedUsers);
                setPosts(savedPosts);
                setMessages(savedMsgs);
                setGroups(savedGroups);
                setLoanRequests(savedLoans);
                setLoginLogs(savedLogs);

                // الاستماع اللحظي للمنشورات من فايربيس
                if (rtdb) {
                    const postsRef = rtdb.ref('risala_posts');
                    postsRef.on('value', (snapshot) => {
                        const val = snapshot.val();
                        if (val) {
                            const cloudPosts = Array.isArray(val) ? val : Object.values(val);
                            setPosts(cloudPosts);
                            localStorage.setItem(`app_posts_${storageVersion}`, JSON.stringify(cloudPosts));
                        }
                    });

                    const usersRef = rtdb.ref('risala_users');
                    usersRef.on('value', (snapshot) => {
                        const val = snapshot.val();
                        if (val) {
                            const cloudUsers = Array.isArray(val) ? val : Object.values(val);
                            setUsers(cloudUsers);
                            localStorage.setItem(`app_users_${storageVersion}`, JSON.stringify(cloudUsers));
                        }
                    });

                    const msgsRef = rtdb.ref('risala_messages');
                    msgsRef.on('value', (snapshot) => {
                        const val = snapshot.val();
                        if (val) {
                            const cloudMsgs = Array.isArray(val) ? val : Object.values(val);
                            setMessages(cloudMsgs);
                            localStorage.setItem(`app_msgs_${storageVersion}`, JSON.stringify(cloudMsgs));
                        }
                    });

                    const loansRef = rtdb.ref('risala_loans');
                    loansRef.on('value', (snapshot) => {
                        const val = snapshot.val();
                        if (val) {
                            const cloudLoans = Array.isArray(val) ? val : Object.values(val);
                            setLoanRequests(cloudLoans);
                            localStorage.setItem(`app_loans_${storageVersion}`, JSON.stringify(cloudLoans));
                        }
                    });
                }

                try {
                    const session = JSON.parse(localStorage.getItem(`app_session_${storageVersion}`));
                    if (session) {
                        const found = savedUsers.find(u => u.id === session.id && u.status === 'active');
                        if (found) {
                            setUser(found);
                            setView('home');
                            if (found.alert) setActiveAlert(String(found.alert));
                        }
                    }
                } catch(e) {}
                setIsLoaded(true);

                return () => {
                    if (rtdb) {
                        rtdb.ref('risala_posts').off();
                        rtdb.ref('risala_users').off();
                        rtdb.ref('risala_messages').off();
                        rtdb.ref('risala_loans').off();
                    }
                };
            }, [rtdb]);

            useEffect(() => {
                if (isLoaded) {
                    const storageVersion = 'v_risala_unified_v2';
                    localStorage.setItem(`app_users_${storageVersion}`, JSON.stringify(users));
                    localStorage.setItem(`app_posts_${storageVersion}`, JSON.stringify(posts));
                    localStorage.setItem(`app_msgs_${storageVersion}`, JSON.stringify(messages));
                    localStorage.setItem(`app_groups_${storageVersion}`, JSON.stringify(groups));
                    localStorage.setItem(`app_loans_${storageVersion}`, JSON.stringify(loanRequests));
                    localStorage.setItem(`app_logs_${storageVersion}`, JSON.stringify(loginLogs));
                }
            }, [users, posts, messages, groups, loanRequests, loginLogs, isLoaded]);

            // مزامنة حالة المستخدم الحالي إذا تم تحديث بياناته من السحابة
            useEffect(() => {
                if (user) {
                    const updatedMe = users.find(u => u.id === user.id);
                    if (updatedMe && JSON.stringify(updatedMe) !== JSON.stringify(user)) {
                        setUser(updatedMe);
                    }
                }
            }, [users]);

            useEffect(() => {
                if (selectedChatTarget && !selectedChatTarget.isGroup && user && view === 'messages') {
                    const hasUnread = messages.some(m => !m.groupId && m.from === selectedChatTarget.id && m.to === user.id && !m.read);
                    if (hasUnread) {
                        const updated = messages.map(m => 
                            (!m.groupId && m.from === selectedChatTarget.id && m.to === user.id) ? { ...m, read: true } : m
                        );
                        setMessages(updated);
                        if (rtdb) rtdb.ref('risala_messages').set(updated);
                    }
                }
            }, [selectedChatTarget, view, user, messages.length]);

            const handleLogin = async (username, password) => {
                const cleanU = username.trim().toLowerCase();
                const found = users.find(u => u.username.toLowerCase() === cleanU && u.password === password);
                if (!found) return "بيانات الدخول غير صحيحة، يرجى التأكد من اسم المستخدم وكلمة المرور";
                if (found.status === 'banned') return "هذا الحساب تم حظره";
                
                const realIP = await fetchRealIP();
                const deviceInfo = getDeviceInfo();
                
                const newLog = {
                    id: Date.now().toString(),
                    userId: found.id,
                    userName: found.name,
                    ip: realIP,
                    device: deviceInfo,
                    time: new Date().toISOString()
                };
                
                setLoginLogs(prev => [newLog, ...prev].slice(0, 50));
                const updatedUsers = users.map(u => u.id === found.id ? { ...u, ip: realIP, device: deviceInfo } : u);
                setUsers(updatedUsers);
                if (rtdb) rtdb.ref('risala_users').set(updatedUsers);
                setUser({ ...found, ip: realIP, device: deviceInfo });
                localStorage.setItem('app_session_v_risala_unified_v2', JSON.stringify({ id: found.id }));
                setView('home');
                if (found.alert) setActiveAlert(String(found.alert));
                return null;
            };

            const handleRegister = async (name, username, password) => {
                if (!name || name.trim().length < 2) return "يرجى كتابة الاسم الكامل بشكل صحيح";
                const cleanU = username.trim().toLowerCase();
                if (!/^[a-zA-Z0-9_]+$/.test(cleanU)) return "اسم المستخدم يجب أن يكون بالإنجليزية والأرقام فقط";
                if (users.find(u => u.username.toLowerCase() === cleanU)) return "اسم المستخدم هذا مستخدم مسبقاً";
                if (!password || password.length < 3) return "كلمة المرور يجب أن لا تقل عن 3 أحرف";

                const realIP = await fetchRealIP();
                const deviceInfo = getDeviceInfo();

                const newUser = {
                    id: Date.now().toString(),
                    name: String(name).trim(),
                    username: cleanU,
                    password: String(password),
                    role: 'user',
                    status: 'active',
                    balance: 50.00,
                    history: [
                        { type: 'in', msg: 'رصيد ترحيبي', amount: 50.00, time: new Date().toLocaleTimeString('ar-IQ') }
                    ],
                    profileColor: '#8B5CF6',
                    alert: null,
                    bio: '',
                    ip: realIP,
                    device: deviceInfo
                };
                const updatedUsers = [...users, newUser];
                setUsers(updatedUsers);
                if (rtdb) rtdb.ref('risala_users').set(updatedUsers);
                setView('login');
                return null;
            };

            const updateProfile = (newData) => {
                const updatedUsers = users.map(u => u.id === user.id ? { ...u, ...newData } : u);
                setUsers(updatedUsers);
                setUser(prev => ({ ...prev, ...newData }));
                if (rtdb) rtdb.ref('risala_users').set(updatedUsers);
            };

            const createPost = (content) => {
                if (!content.trim()) return;
                const newPost = {
                    id: Date.now().toString(),
                    authorId: user.id,
                    authorName: user.name,
                    authorRole: user.role,
                    profileColor: user.profileColor,
                    content: String(content),
                    timestamp: new Date().toISOString(),
                    comments: []
                };
                const updatedPosts = [newPost, ...posts];
                setPosts(updatedPosts);
                // إرسال المنشور مباشرة إلى فايربيس ليظهر لجميع الأجهزة فوراً
                if (rtdb) {
                    rtdb.ref('risala_posts').set(updatedPosts);
                }
            };

            const addComment = (postId, text, parentId = null) => {
                if (!text.trim()) return;
                const newComment = {
                    id: Date.now().toString(),
                    authorId: user.id,
                    authorName: user.name,
                    text: String(text),
                    timestamp: new Date().toISOString(),
                    profileColor: user.profileColor,
                    replies: []
                };
                const updatedPosts = posts.map(p => {
                    if (p.id !== postId) return p;
                    if (!parentId) return { ...p, comments: [...(p.comments || []), newComment] };
                    return {
                        ...p,
                        comments: (p.comments || []).map(c => 
                            c.id === parentId ? { ...c, replies: [...(c.replies || []), newComment] } : c
                        )
                    };
                });
                setPosts(updatedPosts);
                if (rtdb) {
                    rtdb.ref('risala_posts').set(updatedPosts);
                }
            };

            const deleteComment = (postId, commentId, replyId = null) => {
                const updatedPosts = posts.map(p => {
                    if (p.id !== postId) return p;
                    if (!replyId) {
                        return { ...p, comments: (p.comments || []).filter(c => c.id !== commentId) };
                    } else {
                        return {
                            ...p,
                            comments: (p.comments || []).map(c => {
                                if (c.id !== commentId) return c;
                                return { ...c, replies: (c.replies || []).filter(r => r.id !== replyId) };
                            })
                        };
                    }
                });
                setPosts(updatedPosts);
                if (rtdb) {
                    rtdb.ref('risala_posts').set(updatedPosts);
                }
            };

            const createGroup = (groupName, memberIds) => {
                const newGroup = {
                    id: 'grp_' + Date.now().toString(),
                    name: groupName.trim(),
                    createdBy: user.id,
                    members: Array.from(new Set([user.id, ...memberIds])),
                    createdAt: new Date().toISOString()
                };
                setGroups(prev => [newGroup, ...prev]);
                return newGroup;
            };

            const deleteGroup = (groupId) => {
                const updatedGroups = groups.filter(g => g.id !== groupId);
                const updatedMsgs = messages.filter(m => m.groupId !== groupId);
                setGroups(updatedGroups);
                setMessages(updatedMsgs);
                if (rtdb) {
                    rtdb.ref('risala_messages').set(updatedMsgs);
                }
                if (selectedChatTarget?.id === groupId) {
                    setSelectedChatTarget(null);
                }
            };

            const handleRequestLoan = (amount) => {
                const newLoanReq = {
                    id: Date.now().toString(),
                    userId: user.id,
                    amount: amount,
                    status: 'pending',
                    time: new Date().toISOString()
                };
                const updatedLoans = [newLoanReq, ...loanRequests];
                setLoanRequests(updatedLoans);
                if (rtdb) rtdb.ref('risala_loans').set(updatedLoans);
                setLoanModalAmount(null);
            };

            const handleApproveLoan = (loanId) => {
                const loan = loanRequests.find(l => l.id === loanId);
                if (!loan || loan.status !== 'pending') return;

                const targetUserId = loan.userId;
                const currentTime = new Date().toLocaleTimeString('ar-IQ');

                const updatedUsers = users.map(u => {
                    if (u.id === targetUserId) {
                        const newBal = Number(u.balance || 0) + Number(loan.amount);
                        const hist = {
                            type: 'in',
                            msg: `تمويل معتمد من الإدارة`,
                            amount: loan.amount,
                            time: currentTime
                        };
                        return { ...u, balance: newBal, history: [...(u.history || []), hist] };
                    }
                    return u;
                });
                setUsers(updatedUsers);

                const updatedLoans = loanRequests.map(l => l.id === loanId ? { ...l, status: 'approved' } : l);
                setLoanRequests(updatedLoans);

                if (rtdb) {
                    rtdb.ref('risala_users').set(updatedUsers);
                    rtdb.ref('risala_loans').set(updatedLoans);
                }
            };

            const handleRejectLoan = (loanId) => {
                const updatedLoans = loanRequests.map(l => l.id === loanId ? { ...l, status: 'rejected' } : l);
                setLoanRequests(updatedLoans);
                if (rtdb) rtdb.ref('risala_loans').set(updatedLoans);
            };

            const handleTransferCoins = (recipientUsername, amount) => {
                const targetU = recipientUsername.trim().toLowerCase();
                if (!targetU || !amount || isNaN(amount) || amount <= 0) {
                    return { success: false, msg: "يرجى تحديد اسم مستخدم ومبلغ صحيحين" };
                }
                if (targetU === user.username.toLowerCase()) {
                    return { success: false, msg: "لا يمكنك التحويل لنفسك" };
                }
                const recipientObj = users.find(u => u.username.toLowerCase() === targetU);
                if (!recipientObj) {
                    return { success: false, msg: "المستلم غير موجود" };
                }
                if (recipientObj.status === 'banned') {
                    return { success: false, msg: "هذا الحساب معطل حالياً" };
                }
                if (user.role !== 'admin' && Number(user.balance || 0) < amount) {
                    return { success: false, msg: "رصيدك غير كافٍ لإتمام العملية" };
                }

                const currentTime = new Date().toLocaleTimeString('ar-IQ');
                const updatedSenderBalance = user.role === 'admin' ? user.balance : Number(user.balance || 0) - amount;
                const senderHistoryItem = { type: 'out', msg: `حوالة إلى @${recipientObj.username}`, amount, time: currentTime };
                const updatedRecipientBalance = Number(recipientObj.balance || 0) + amount;
                const recipientHistoryItem = { type: 'in', msg: `استلام من @${user.username}`, amount, time: currentTime };

                const updatedUsers = users.map(u => {
                    if (u.id === user.id) {
                        return { ...u, balance: updatedSenderBalance, history: [...(u.history || []), senderHistoryItem] };
                    }
                    if (u.id === recipientObj.id) {
                        return { ...u, balance: updatedRecipientBalance, history: [...(u.history || []), recipientHistoryItem] };
                    }
                    return u;
                });

                setUsers(updatedUsers);
                if (rtdb) rtdb.ref('risala_users').set(updatedUsers);

                return { success: true, msg: `تم إرسال ${amount.toFixed(2)} كوين إلى @${recipientObj.username} بنجاح` };
            };

            const handleAdjustCoinsByAdmin = (targetUserId, deltaAmount) => {
                if (isNaN(deltaAmount) || deltaAmount === 0) return;
                const currentTime = new Date().toLocaleTimeString('ar-IQ');
                const isAddition = deltaAmount > 0;

                const updatedUsers = users.map(u => {
                    if (u.id === targetUserId) {
                        const newBal = Math.max(0, Number(u.balance || 0) + deltaAmount);
                        const hist = {
                            type: isAddition ? 'in' : 'out',
                            msg: `تعديل من المسؤول`,
                            amount: Math.abs(deltaAmount),
                            time: currentTime
                        };
                        return { ...u, balance: newBal, history: [...(u.history || []), hist] };
                    }
                    return u;
                });

                setUsers(updatedUsers);
                if (rtdb) rtdb.ref('risala_users').set(updatedUsers);
            };

            const handleLogout = () => {
                setUser(null);
                setSelectedChatTarget(null);
                setView('login');
                localStorage.removeItem('app_session_v_risala_unified_v2');
            };

            const handleDeletePost = (id) => {
                const updatedPosts = posts.filter(item => item.id !== id);
                setPosts(updatedPosts);
                if (rtdb) rtdb.ref('risala_posts').set(updatedPosts);
            };

            if (!isLoaded) return null;

            if (view === 'login' || view === 'register') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-5 bg-[#FDFCF8]" dir="rtl">
                        <div className="w-full max-w-md bg-white rounded-[2.5rem] shadow-2xl overflow-hidden border border-gray-100 animate-in zoom-in-95 relative">
                            <div className={`p-9 text-center text-white ${UI_CONFIG.inkGradient} relative overflow-hidden`}>
                                <div className="absolute top-0 left-0 w-full h-full opacity-10 bg-[radial-gradient(circle,rgba(255,255,255,0.4)1px,transparent 1px)] [background-size:20px_20px]"></div>
                                <div className="relative z-10">
                                    <div className="bg-white/10 w-20 h-20 rounded-[2rem] flex items-center justify-center mx-auto mb-3 backdrop-blur-md border border-white/20 animate-icon-float">
                                        <MotionIcon iconName="Send" size={38} className="text-amber-400 rotate-180" />
                                    </div>
                                    <h2 className="text-3xl font-black tracking-tight">رسالة</h2>
                                    <p className="text-purple-200 text-xs mt-1 font-bold tracking-widest uppercase">تواصل ومدفوعات</p>
                                </div>
                            </div>
                            <div className="p-7">
                                <AuthForm view={view} setView={setView} onLogin={handleLogin} onRegister={handleRegister} />
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex flex-col h-screen text-right" dir="rtl" style={{ backgroundColor: UI_CONFIG.colors.milkyWhite }}>
                    {/* نافذة التنبيه */}
                    {activeAlert && (
                        <div className="fixed inset-0 z-[300] flex items-center justify-center p-6 bg-black/60 backdrop-blur-md">
                            <div className="bg-white rounded-[2.5rem] p-8 max-w-sm w-full text-center shadow-2xl border-2 border-red-500 animate-in zoom-in-95">
                                <div className="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4 animate-bounce">
                                    <MotionIcon iconName="ShieldAlert" size={32} />
                                </div>
                                <h3 className="text-xl font-bold text-[#2E1A47] mb-2">تنبيه من الإدارة</h3>
                                <div className="bg-gray-50 p-4 rounded-2xl mb-6 text-xs text-gray-700 leading-relaxed font-bold">{activeAlert}</div>
                                <button type="button" onClick={() => { 
                                    setActiveAlert(null); 
                                    setUsers(prev => prev.map(u => u.id === user.id ? { ...u, alert: null } : u)); 
                                }} className="w-full py-3 bg-red-600 text-white rounded-xl font-bold shadow-lg active:scale-95 transition-all">حسناً، فهمت</button>
                            </div>
                        </div>
                    )}

                    {/* نافذة طلب التمويل */}
                    {loanModalAmount && (
                        <div className="fixed inset-0 z-[300] flex items-center justify-center p-6 bg-black/60 backdrop-blur-md">
                            <div className="bg-white rounded-[2.5rem] p-8 max-w-sm w-full text-center shadow-2xl border border-amber-400 animate-in zoom-in-95">
                                <div className="w-16 h-16 bg-amber-100 text-amber-600 rounded-2xl flex items-center justify-center mx-auto mb-4">
                                    <i className="fa-solid fa-vault text-2xl"></i>
                                </div>
                                <h3 className="text-lg font-black text-[#2E1A47] mb-1">طلب تمويل رصيد</h3>
                                <p className="text-xs text-gray-500 font-bold mb-4">
                                    سيتم إرسال طلب تمويل بقيمة <span className="text-amber-600 font-black text-sm">{loanModalAmount} كوين</span> إلى الإدارة للمراجعة والموافقة.
                                </p>
                                <div className="bg-gray-50 p-3 rounded-xl text-xs font-bold text-gray-600 mb-5 border">
                                    تتم إضافة الرصيد بعد موافقة المسؤول
                                </div>
                                <div className="space-y-2">
                                    {user.role === 'admin' ? (
                                        <button 
                                            type="button" 
                                            onClick={() => {
                                                handleAdjustCoinsByAdmin(user.id, loanModalAmount);
                                                setLoanModalAmount(null);
                                            }} 
                                            className="w-full py-3.5 bg-gradient-to-r from-amber-500 to-amber-600 text-[#2E1A47] rounded-xl font-black shadow-md active:scale-95 transition-all text-xs"
                                        >
                                            شحن فوري (صلاحية مسؤول)
                                        </button>
                                    ) : (
                                        <button 
                                            type="button" 
                                            onClick={() => handleRequestLoan(loanModalAmount)} 
                                            className="w-full py-3.5 bg-gradient-to-r from-amber-500 to-amber-600 text-[#2E1A47] rounded-xl font-black shadow-md active:scale-95 transition-all text-xs"
                                        >
                                            إرسال الطلب للإدارة
                                        </button>
                                    )}
                                    <button 
                                        type="button" 
                                        onClick={() => setLoanModalAmount(null)} 
                                        className="w-full py-3 text-gray-400 font-bold text-xs hover:text-gray-600"
                                    >
                                        إلغاء
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* الشريط العلوي للهواتف: رفع إشارة التطبيق وعداد النقود إلى أعلى التطبيق */}
                    <header className="md:hidden sticky top-0 z-[70] px-4 py-2.5 flex justify-between items-center glass-morphism border-b border-gray-100 shadow-sm">
                        <div className="flex items-center gap-2 cursor-pointer" onClick={() => setView('home')}>
                            <div className={`p-1.5 rounded-xl ${UI_CONFIG.inkGradient} text-white shadow-sm`}>
                                <MotionIcon iconName="Send" className="rotate-180" size={16} />
                            </div>
                            <div>
                                <span className="font-black text-sm text-[#2E1A47] block leading-tight">رسالة</span>
                                <span className="text-[8px] text-gray-400 font-bold block leading-none">تواصل ومدفوعات</span>
                            </div>
                        </div>
                        <div className="flex items-center gap-2">
                            <button type="button" onClick={() => setView('bank')} className="flex items-center gap-1.5 bg-amber-50 border border-amber-200/80 px-2.5 py-1 rounded-xl shadow-xs active:scale-95 transition-all">
                                <MotionIcon iconName="Coins" size={13} className="text-amber-600" />
                                <span className="text-[11px] font-black text-[#2E1A47]">
                                    {user?.role === 'admin' ? "∞" : Number(user?.balance || 0).toFixed(2)} كوين
                                </span>
                            </button>
                            <button type="button" onClick={() => setView('profile')} className="flex items-center gap-1.5 bg-white border border-gray-100 px-2 py-1 rounded-xl shadow-xs active:scale-95 transition-all">
                                <div className="w-5 h-5 rounded-md flex items-center justify-center text-white font-black text-[10px]" style={{ backgroundColor: user?.profileColor || '#2E1A47' }}>
                                    {String(user?.name)?.[0]}
                                </div>
                                <span className="text-[10px] font-bold text-[#2E1A47] max-w-[55px] truncate">{String(user?.name)}</span>
                            </button>
                        </div>
                    </header>

                    {/* الشريط العلوي - مخصص للشاشات المتوسطة والكبيرة (الحواسيب) */}
                    <header className={`hidden md:flex sticky top-0 z-[70] px-6 py-3.5 justify-between items-center ${UI_CONFIG.glassEffect} border-b shadow-sm`}>
                        <div className="flex items-center gap-3 group cursor-pointer" onClick={() => setView('home')}>
                            <div className={`p-2 rounded-xl ${UI_CONFIG.inkGradient} shadow-md shadow-purple-900/20 group-hover:rotate-6 transition-transform`}>
                                <MotionIcon iconName="Send" className="text-white rotate-180" size={20} />
                            </div>
                            <div>
                                <h1 className="text-lg font-black tracking-tight" style={{ color: UI_CONFIG.colors.inkPurple }}>رسالة</h1>
                                <span className="text-[9px] text-gray-400 font-bold -mt-1 block">تواصل ومدفوعات</span>
                            </div>
                        </div>
                        <div className="flex items-center gap-3">
                            <button type="button" onClick={() => setView('bank')} className="flex items-center gap-2 bg-amber-50 border border-amber-200/80 px-3.5 py-1.5 rounded-2xl shadow-sm hover:scale-105 transition-all">
                                <MotionIcon iconName="Coins" size={16} className="text-amber-600" />
                                <span className="text-xs font-black text-[#2E1A47]">{user?.role === 'admin' ? "∞" : Number(user?.balance || 0).toFixed(2)} كوين</span>
                            </button>
                            <button type="button" onClick={() => setView('profile')} className="flex items-center gap-2.5 bg-white border px-3 py-1.5 rounded-2xl shadow-sm hover:border-purple-300 transition-all group">
                                <div className="text-left hidden md:block">
                                    <p className="text-[11px] font-black text-[#2E1A47] leading-none">{String(user?.name)}</p>
                                    <p className="text-[9px] text-purple-600 font-bold">@{String(user?.username)}</p>
                                </div>
                                <div className="w-8 h-8 rounded-xl flex items-center justify-center text-white font-black text-xs shadow-inner" style={{ backgroundColor: user?.profileColor || '#2E1A47' }}>{String(user?.name)?.[0]}</div>
                            </button>
                        </div>
                    </header>

                    {/* المحتوى الرئيسي وشريط التوجيه */}
                    <div className="flex flex-1 overflow-hidden">
                        <aside className="hidden md:flex flex-col w-72 bg-[#2E1A47] text-white p-5 gap-2 border-l border-white/5">
                            <SidebarItem iconName="Home" label="الرئيسية والمنشورات" active={view === 'home'} onClick={() => setView('home')} />
                            <SidebarItem iconName="MessageSquare" label="الرسائل والمجموعات" active={view === 'messages'} onClick={() => setView('messages')} badge={unreadMessagesCount > 0 ? unreadMessagesCount : null} />
                            <SidebarItem iconName="Wallet" label="المحفظة والعملات" active={view === 'bank'} onClick={() => setView('bank')} />
                            <SidebarItem iconName="User" label="الملف الشخصي" active={view === 'profile'} onClick={() => setView('profile')} />
                            {user?.role === 'admin' && <SidebarItem iconName="ShieldCheck" label="لوحة الإدارة" active={view === 'admin'} onClick={() => setView('admin')} />}
                            <div className="mt-auto border-t border-white/10 pt-4">
                                <button type="button" onClick={handleLogout} className="flex items-center gap-3 w-full p-3.5 text-red-300 hover:bg-red-500/10 rounded-2xl transition-all font-bold group text-sm">
                                    <MotionIcon iconName="LogOut" size={18} className="group-hover:-translate-x-1 transition-transform" /> تسجيل الخروج
                                </button>
                            </div>
                        </aside>

                        <main className="flex-1 overflow-y-auto p-4 md:p-8 pb-28 md:pb-8 bg-[#FDFCF8]">
                            <div className="max-w-4xl mx-auto h-full">
                                {view === 'home' && (
                                    <HomeView 
                                        posts={posts} user={user} createPost={createPost} addComment={addComment} onDeleteComment={deleteComment}
                                        activeCommentPost={activeCommentPost} setActiveCommentPost={setActiveCommentPost}
                                        activeReplyToId={activeReplyToId} setActiveReplyToId={setActiveReplyToId}
                                    />
                                )}
                                {view === 'messages' && (
                                    <MessagesView 
                                        users={users} currentUser={user} messages={messages} 
                                        setMessages={(newMsgs) => {
                                            setMessages(newMsgs);
                                            if (rtdb) rtdb.ref('risala_messages').set(newMsgs);
                                        }} 
                                        groups={groups} createGroup={createGroup} deleteGroup={deleteGroup}
                                        selectedTarget={selectedChatTarget} setSelectedTarget={setSelectedChatTarget} 
                                    />
                                )}
                                {view === 'bank' && <BankView user={user} users={users} userLoans={loanRequests} onTransfer={handleTransferCoins} onOpenLoanModal={(amt) => setLoanModalAmount(amt)} />}
                                {view === 'profile' && <ProfileView user={user} posts={posts} updateProfile={updateProfile} onDeletePost={handleDeletePost} onLogout={handleLogout} />}
                                {view === 'admin' && (
                                    <AdminView 
                                        users={users} 
                                        setUsers={(updater) => {
                                            const updated = typeof updater === 'function' ? updater(users) : updater;
                                            setUsers(updated);
                                            if (rtdb) rtdb.ref('risala_users').set(updated);
                                        }} 
                                        posts={posts} onDeletePost={handleDeletePost} 
                                        adminTab={adminTab} setAdminTab={setAdminTab} loginLogs={loginLogs} 
                                        onAdjustCoins={handleAdjustCoinsByAdmin}
                                        loanRequests={loanRequests} onApproveLoan={handleApproveLoan} onRejectLoan={handleRejectLoan}
                                    />
                                )}
                            </div>
                        </main>
                    </div>

                    {/* شريط الملاحة السفلي لشاشات الهواتف */}
                    <div className="md:hidden fixed bottom-3 inset-x-3 z-[100]">
                        <nav className="h-16 glass-morphism rounded-2xl flex justify-around items-center px-2 shadow-2xl border border-gray-100">
                            <MobileNavItem iconName="Home" label="الرئيسية" active={view === 'home'} onClick={() => setView('home')} />
                            <MobileNavItem iconName="MessageSquare" label="الرسائل" active={view === 'messages'} onClick={() => setView('messages')} badge={unreadMessagesCount > 0 ? unreadMessagesCount : null} />
                            <MobileNavItem iconName="Wallet" label="المحفظة" active={view === 'bank'} onClick={() => setView('bank')} />
                            <MobileNavItem iconName="User" label="حسابي" active={view === 'profile'} onClick={() => setView('profile')} />
                            {user?.role === 'admin' && <MobileNavItem iconName="ShieldCheck" label="الإدارة" active={view === 'admin'} onClick={() => setView('admin')} />}
                        </nav>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        // تسجيل Service Worker الخاص بالـ PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('PWA Service Worker مسجل بنجاح:', reg.scope))
                    .catch((err) => console.warn('تعذر تسجيل Service Worker:', err));
            });
        }
    </script>
</body>
</html>
